schema_version = 1
id = "npm-sdk"
owner = "sdk"
owned_paths = ["sdk/npm", "compatibility/consumers/npm", "compatibility/consumers/rust"]

[tasks.rust-consumer]
kind = "package"
command = ["python", "-m", "tools.abc_package_task", "rust"]
dependencies = ["sha256:rust-tests"]
tools = ["cargo", "rustc", "rustup"]
outputs = ["abc-sha256-0.1.0.crate", "consumer.json"]

[tasks.npm-consumer]
kind = "package"
command = ["python", "-m", "tools.abc_package_task", "npm"]
dependencies = ["sha256:rust-tests"]
tools = ["cargo", "rustc", "rustup", "node"]
outputs = ["abc-cryptography-research-0.1.0.tgz", "consumer.json"]
target = "wasm32-unknown-unknown"
