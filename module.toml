schema_version = 1
id = "repository-assurance"
owner = "integration"
owned_paths = [".gitattributes", ".gitignore", ".github", "README.md", "abc.py", "Cargo.toml", "Cargo.lock", "compatibility/sha256-vectors.json", "docs", "governance", "registry", "schemas", "security", "tools", "fixtures", "tests"]

[tasks.registry]
kind = "metadata"
always = true
command = ["python", "abc.py", "registry", "validate", "--strict"]

[tasks.fixtures]
kind = "test"
command = ["python", "-m", "unittest", "discover", "-s", "fixtures/registry", "-p", "test_*.py"]

[tasks.assurance-tests]
kind = "test"
command = ["python", "-m", "unittest", "discover", "-s", "tests", "-p", "test_*.py"]
tools = ["git"]

[tasks.status]
kind = "docs"
always = true
command = ["python", "abc.py", "status"]

[tasks.compatibility]
kind = "compatibility"
command = ["python", "-m", "unittest", "discover", "-s", "fixtures/registry", "-p", "test_*.py"]
inputs = ["compatibility/sha256-vectors.json"]
