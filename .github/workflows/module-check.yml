name: ABC reusable checks

on:
  workflow_call:
    inputs:
      base:
        required: true
        type: string
      head:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ (inputs.target == 'formal-probe:native-fuzz' || inputs.target == 'sha256:differential-fuzz') && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false
          path: baseline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        if: inputs.target == 'formal-probe:native-fuzz' || inputs.target == 'sha256:differential-fuzz'
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Prepare pinned research Rust tools
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - name: Populate caches for the selected fuzz harness
        shell: bash
        working-directory: candidate
        env:
          TASK: ${{ inputs.target }}
        run: |
          case "$TASK" in
            formal-probe:native-fuzz) cargo +1.92.0 fetch --locked --manifest-path tools/verification/probe/rust/fuzz/Cargo.toml ;;
            sha256:differential-fuzz) cargo +1.92.0 fetch --locked --manifest-path src/crypto/hash/sha256/impl/rust/fuzz/Cargo.toml ;;
          esac
      - name: Verify the selected task and its prerequisites
        shell: bash
        working-directory: baseline
        env:
          EVENT_BASE: ${{ inputs.base }}
          EVENT_HEAD: ${{ inputs.head }}
          TASK: ${{ inputs.target }}
        run: python -m tools.verification.abc_ci worker --repo ../candidate --base "$EVENT_BASE" --head "$EVENT_HEAD" --target "$TASK" --directory "$RUNNER_TEMP/abc/run"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: abc-task-${{ inputs.artifact }}
          path: ${{ runner.temp }}/abc/run
          if-no-files-found: error
          retention-days: 3
