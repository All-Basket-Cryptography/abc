name: ABC independent Swift HMAC-SHA-256

on:
  pull_request:
    paths:
      - 'src/crypto/mac/hmac-sha256/impl/swift/**'
      - 'src/crypto/hash/sha256/impl/swift/**'
      - '.github/workflows/hmac-sha256-independent-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-swift:
    name: Swift 6.1.2 macOS release-mode HMAC tests
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Test the independent SwiftPM HMAC core
        run: python -B src/crypto/mac/hmac-sha256/impl/swift/check.py --output dist/hmac-sha256-independent-swift
      - name: Retain the native check report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abc-hmac-sha256-independent-swift-macos-arm64
          path: dist/hmac-sha256-independent-swift/
          if-no-files-found: error
          retention-days: 7
