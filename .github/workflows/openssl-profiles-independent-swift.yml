name: ABC independent Swift OpenSSL profiles

on:
  pull_request:
    paths:
      - 'src/crypto/kdf/argon2id/impl/swift/**'
      - 'src/crypto/kdf/argon2id/impl/go/**'
      - 'src/crypto/hash/blake2b/impl/go/**'
      - 'src/crypto/signature/ecdsa-p256-sha256/impl/swift/**'
      - 'src/crypto/agreement/ml-kem-768/impl/swift/**'
      - 'src/crypto/agreement/ml-kem-768/spec/acvp.json'
      - 'src/crypto/signature/ml-dsa-65/impl/swift/**'
      - 'src/crypto/signature/ml-dsa-65/spec/acvp-fips204-sample.json'
      - 'src/crypto/agreement/x25519/impl/swift/**'
      - '.github/workflows/openssl-profiles-independent-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-swift:
    name: Swift 6.1.2 macOS ${{ matrix.profile }}
    runs-on: macos-15
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        profile: [argon2id, ecdsa-p256-sha256, ml-kem-768, ml-dsa-65]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      GOPROXY: 'off'
      GOTOOLCHAIN: local
      GOFIPS140: 'off'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        if: matrix.profile != 'ecdsa-p256-sha256'
        with:
          go-version: '1.27.4'
          cache: false
      - name: Exercise independent SwiftPM consumer
        shell: bash
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          evidence=dist/swift-openssl-profiles
          mkdir -p "$evidence"
          sw_vers | tee "$evidence/macos.txt"
          xcodebuild -version | tee "$evidence/xcode.txt"
          openssl="$(brew --prefix openssl@3)"
          export PKG_CONFIG_PATH="$openssl/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          "$openssl/bin/openssl" version -a | tee "$evidence/openssl.txt"
          shasum -a 256 "$openssl/lib/libcrypto.3.dylib" | tee "$evidence/provider-sha256.txt"
          python -B src/crypto/kdf/argon2id/impl/swift/check.py "$PROFILE" | tee "$evidence/results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abc-swift-${{ matrix.profile }}-macos-arm64
          path: dist/swift-openssl-profiles/
          if-no-files-found: error
          retention-days: 7
