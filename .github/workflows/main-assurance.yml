name: ABC main assurance

on:
  push:
    branches: [main]
  schedule:
    - cron: '21 18 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Install native and WASM Rust tooling
        run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - name: Fetch lockfile-pinned fuzz dependencies
        run: |
          cargo +1.92.0 fetch --locked --manifest-path formal/probe/rust/fuzz/Cargo.toml
          cargo +1.92.0 fetch --locked --manifest-path algorithms/hash/sha2/sha256/fuzz/Cargo.toml
      - name: Run the complete verification plan
        run: |
          python -m tools.abc_cli plan --head HEAD --output .abc/plan.json
          python -m tools.abc_cli run --plan .abc/plan.json --output .abc/full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: abc-main-diagnostics
          path: .abc/full
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
