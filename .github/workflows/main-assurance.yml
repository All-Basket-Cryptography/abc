name: ABC main native and Lean assurance

on:
  push:
    branches: [main]
  schedule:
    - cron: '21 18 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-fuzz:
    name: main ${{ matrix.task }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: formal-probe:native-fuzz
            manifest: tools/verification/probe/rust/fuzz/Cargo.toml
            artifact: bounded-probe
          - task: sha256:differential-fuzz
            manifest: src/crypto/hash/sha256/impl/rust/fuzz/Cargo.toml
            artifact: sha256
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Install pinned native Rust tooling
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Fetch lockfile-pinned fuzz dependencies
        env:
          FUZZ_MANIFEST: ${{ matrix.manifest }}
        run: cargo +1.92.0 fetch --locked --manifest-path "$FUZZ_MANIFEST"
      - name: Run the provisioned native fuzz task
        env:
          ABC_FUZZ_TASK: ${{ matrix.task }}
        run: |
          ulimit -c 0
          python -B -m tools.abc_cli plan --head "$GITHUB_SHA" --output .abc/main-plan.json
          python -B -m tools.abc_cli run --plan .abc/main-plan.json --target "$ABC_FUZZ_TASK" --output .abc/main-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: abc-main-fuzz-${{ matrix.artifact }}
          path: |
            .abc/main-plan.json
            .abc/main-run
            .abc/probe-fuzz/run-*/result.json
            .abc/sha256-fuzz/run-*/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  source-proofs:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sha256-model.yml
  poly1305:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/poly1305-model.yml
