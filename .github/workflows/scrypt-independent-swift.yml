name: ABC independent Swift scrypt

on:
  pull_request:
    paths:
      - 'src/crypto/kdf/scrypt/impl/swift/**'
      - 'src/crypto/kdf/pbkdf2-hmac-sha256/impl/swift/**'
      - 'src/crypto/mac/hmac-sha256/impl/swift/**'
      - 'src/crypto/hash/sha256/impl/swift/**'
      - '.github/workflows/scrypt-independent-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-swift:
    name: Swift 6.1.2 macOS scrypt
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Generate oracle cases and exercise Swift scrypt
        shell: bash
        run: |
          set -euo pipefail
          leaf=src/crypto/kdf/scrypt/impl/swift
          package="$leaf/AbcScryptSwift"
          evidence=dist/swift-scrypt
          mkdir -p "$evidence"
          export ABC_SCRYPT_FIXTURES="$RUNNER_TEMP/abc-scrypt.json"
          python -B "$leaf/make_fixtures.py" "$ABC_SCRYPT_FIXTURES"
          swift --version | tee "$evidence/toolchain.txt"
          grep -E 'Apple Swift version 6\.1\.2([[:space:]]|$)' "$evidence/toolchain.txt"
          grep -E '^Target: arm64-apple-macosx' "$evidence/toolchain.txt"
          swift test --package-path "$package" --scratch-path "$RUNNER_TEMP/AbcScryptSwift" \
            --configuration release -Xswiftc -warnings-as-errors 2>&1 | tee "$evidence/swift-test.log"
          grep -E 'Executed 1 test, with 0 failures' "$evidence/swift-test.log"
          grep -Fx 'known_answers=2' "$evidence/swift-test.log"
          grep -Fx 'openssl_comparisons=144' "$evidence/swift-test.log"
          grep -Fx 'budget_rejections=144' "$evidence/swift-test.log"
          shasum -a 256 "$package/Sources/AbcScryptSwift/Scrypt.swift" "$ABC_SCRYPT_FIXTURES" \
            > "$evidence/source-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abc-swift-scrypt
          path: dist/swift-scrypt/
          if-no-files-found: error
          retention-days: 7
