name: ABC independent Swift RFC 8439

on:
  pull_request:
    paths:
      - 'src/crypto/cipher/chacha20/impl/swift/**'
      - 'src/crypto/mac/poly1305/impl/swift/**'
      - 'src/crypto/aead/chacha20-poly1305/impl/swift/**'
      - 'src/crypto/cipher/chacha20/impl/csharp/check.py'
      - 'src/crypto/aead/chacha20-poly1305/impl/c/check.py'
      - '.github/workflows/rfc8439-independent-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-swift:
    name: Swift 6.1.2 macOS RFC 8439
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Test independent SwiftPM consumers against RFC 8439 and OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          evidence=dist/swift-rfc8439
          mkdir -p "$evidence"
          swift --version | tee "$evidence/toolchain.txt"
          grep -E 'Apple Swift version 6\.1\.2([[:space:]]|$)' "$evidence/toolchain.txt"
          grep -E '^Target: arm64-apple-macosx' "$evidence/toolchain.txt"
          export ABC_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          node --version | tee "$evidence/node.txt"
          "$ABC_OPENSSL" version | tee "$evidence/openssl.txt"
          python -B src/crypto/cipher/chacha20/impl/swift/check.py all | tee "$evidence/results.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abc-swift-rfc8439-macos-arm64
          path: dist/swift-rfc8439/
          if-no-files-found: error
          retention-days: 7
