name: ABC Swift research package

on:
  pull_request:
    paths:
      - 'src/crypto/hash/sha256/sdk/swift/**'
      - 'src/crypto/hash/sha256/sdk/c/**'
      - 'src/crypto/hash/sha256/**'
      - '.github/workflows/swift-package.yml'
      - 'tools/build/rust/Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-consumer:
    name: macOS SwiftPM research consumer
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Build and run the clean SwiftPM consumer
        env:
          ABC_TASK_OUTPUT: ${{ github.workspace }}/dist/swift
        run: python -B src/crypto/hash/sha256/sdk/swift/package.py --consumer --output dist/swift
      - name: Retain the tested package and conformance report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abc-swift-research-macos-arm64
          path: |
            dist/swift/abc-swift-*.zip
            dist/swift/swift-artifacts.json
          if-no-files-found: error
          retention-days: 7
