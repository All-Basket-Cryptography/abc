name: ABC SHA-256, HMAC and HKDF model refinement (advisory)

on:
  pull_request:
    paths:
      - '.github/workflows/sha256-model.yml'
      - 'src/crypto/hash/sha256/impl/rust/**'
      - 'src/crypto/hash/sha256/spec/**'
      - 'tools/build/rust/**'
      - 'src/lean/**'
      - 'src/crypto/hash/sha512/spec/**'
      - 'src/crypto/hash/blake2b/spec/**'
      - 'src/crypto/hash/shake256/spec/**'
      - 'src/crypto/hash/keccak-p1600/spec/**'
      - 'src/crypto/cipher/chacha20/spec/**'
      - 'src/crypto/cipher/chacha20/impl/java/*.lean'
      - 'src/crypto/kdf/pbkdf2-hmac-sha256/spec/**'
      - 'src/crypto/kdf/scrypt/spec/**'
      - 'src/crypto/kdf/argon2id/spec/**'
      - 'src/crypto/mac/poly1305/spec/**'
      - 'src/crypto/mac/poly1305/impl/java/*.lean'
      - 'src/crypto/agreement/x25519/spec/**'
      - 'src/crypto/hash/sha512/spec/**'
      - 'src/crypto/aead/chacha20-poly1305/spec/**'
      - 'src/crypto/cipher/aes256/spec/**'
      - 'src/crypto/aead/aes256-gcm/spec/**'
      - 'tools/verification/probe/toolchain-candidate.json'
      - 'tools/verification/hmac-hkdf/**'
      - 'tools/verification/sha512/**'
      - 'src/crypto/mac/hmac-sha256/impl/rust/**'
      - 'src/crypto/mac/hmac-sha256/spec/**'
      - 'src/crypto/kdf/hkdf-sha256/impl/rust/**'
      - 'src/crypto/kdf/hkdf-sha256/spec/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    name: Extract the portable SHA-256 Rust model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: AeneasVerif/aeneas
          ref: 505b6ca35217e7be5c96c3e2f8045edfbdf47291
          path: .abc/formal-tools/aeneas
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: AeneasVerif/charon
          ref: b104e24fea7d721b71e6c39fd70f26ff20bc0980
          path: .abc/formal-tools/aeneas/charon
          persist-credentials: false
      - name: Install the pinned Aeneas and Charon release
        shell: bash
        run: |
          aeneas="$GITHUB_WORKSPACE/.abc/formal-tools/aeneas"
          archive="$RUNNER_TEMP/aeneas-505b6ca-linux-x86_64.tar.gz"
          release_dir="$RUNNER_TEMP/aeneas-505b6ca"
          test "$(tail -n 1 "$aeneas/charon-pin")" = b104e24fea7d721b71e6c39fd70f26ff20bc0980
          curl --silent --show-error --fail --location --proto '=https' --retry 2 --max-time 180 \
            --output "$archive" https://github.com/AeneasVerif/aeneas/releases/download/nightly-2026.09.09-505b6ca/aeneas-linux-x86_64.tar.gz
          printf '%s  %s\n' d5ba53b1370d30866bcd86de5e34abfbadf09e76b3689a7f70f458cd0c133591 "$archive" | sha256sum --check --strict
          mkdir "$release_dir"
          tar -xzf "$archive" -C "$release_dir"
          "$release_dir/aeneas" -version | grep -Fx 'aeneas nightly-2026.09.09-505b6ca'
          test "$("$release_dir/charon" toolchain-version)" = nightly-2026-08-18
          mkdir -p "$aeneas/bin" "$aeneas/charon/bin"
          ln -s "$release_dir/aeneas" "$aeneas/bin/aeneas"
          ln -s "$release_dir/charon" "$aeneas/charon/bin/charon"
          rustup toolchain install nightly-2026-08-18 --profile minimal
          printf 'ABC_AENEAS_ROOT=%s\n' "$aeneas" >> "$GITHUB_ENV"
      - name: Extract and compare the complete Rust model
        id: full
        run: node src/crypto/hash/sha256/impl/rust/formal/extract.mjs
      - name: Diagnose the compression call graph separately
        if: ${{ failure() && steps.full.outcome == 'failure' }}
        run: node src/crypto/hash/sha256/impl/rust/formal/extract.mjs --item crate::compress
      - name: Install the pinned Lean release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/lean-4.31.0-linux.tar.zst"
          curl --silent --show-error --fail --location --proto '=https' --retry 2 --max-time 300 \
            --output "$archive" https://github.com/leanprover/lean4/releases/download/v4.31.0/lean-4.31.0-linux.tar.zst
          printf '%s  %s\n' 07a633cc8d9151cbc08825ea4cdda50d4b02a2c9cb852c0131b13046f49cad7f "$archive" | sha256sum --check --strict
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/lean-4.31.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check new arithmetic and encoding lemmas
        run: |
          for algorithm in sha512 shake256 chacha20 pbkdf2; do
            python3 src/lean/check.py "$algorithm"
          done
          lean src/crypto/hash/blake2b/spec/Blake2bBuffer.lean
          lean src/crypto/mac/poly1305/spec/Poly1305Reduction.lean
          lean -DwarningAsError=true src/crypto/mac/poly1305/spec/Poly1305Radix13.lean
          lean -DwarningAsError=true src/crypto/cipher/chacha20/impl/java/ChaCha20StreamingBounds.lean
          lean -DwarningAsError=true src/crypto/mac/poly1305/impl/java/Poly1305JavaWords.lean
          lean src/crypto/agreement/x25519/spec/X25519Field.lean
          lean src/crypto/agreement/x25519/spec/X25519CarryBounds.lean
          lean src/crypto/hash/sha512/spec/Sha512Ring.lean
          lean src/crypto/hash/sha512/spec/Sha512SplitWord.lean
          lean src/crypto/hash/sha512/impl/c/proof/Sha512LengthHalves.lean
          lean src/crypto/hash/keccak-p1600/spec/KeccakRound.lean
          lean src/crypto/hash/keccak-p1600/spec/KeccakSplitWord.lean
          python3 -B src/lean/check.py keccak-reader
          lean src/crypto/hash/keccak-p1600/impl/cpp/proof/KeccakCppTables.lean
          lean src/crypto/mac/poly1305/impl/go/Poly1305GoModel.lean
          lean src/crypto/cipher/aes256/impl/go/Aes256GoSquare.lean
          lean src/crypto/aead/chacha20-poly1305/spec/ChaCha20Poly1305Lengths.lean
          lean -DwarningAsError=true src/crypto/aead/chacha20-poly1305/spec/ChaCha20Poly1305Rfc.lean
          lean -DwarningAsError=true src/crypto/aead/aes256-gcm/spec/Aes256GcmComposition.lean
          python3 -B tools/verification/sha512/check.py --negative-controls
          lean src/crypto/kdf/scrypt/spec/ScryptBounds.lean
          lean -DwarningAsError=true src/crypto/kdf/scrypt/spec/ScryptFunctional.lean
          lean src/crypto/kdf/argon2id/spec/Argon2idBounds.lean
          lean src/crypto/cipher/aes256/spec/Aes256Byte.lean
          lean src/crypto/aead/aes256-gcm/spec/Aes256GcmBounds.lean
      - name: Check SHA-256, HMAC and HKDF refinements
        env:
          ABC_FORMAL_USE_MATHLIB_CACHE: '1'
        run: node tools/verification/hmac-hkdf/check.mjs .abc/sha256-extraction/run-*/result.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: sha256-extraction-untrusted-pr
          path: |
            .abc/sha256-extraction/run-*/result.json
            .abc/sha256-extraction/run-*/*.log
            .abc/sha256-extraction/run-*/*.llbc
            .abc/sha256-extraction/run-*/*.txt
            .abc/sha256-extraction/run-*/lean-*/**/*.lean
            .abc/sha256-extraction/run-*/proof-*/result.json
            .abc/sha256-extraction/run-*/proof-*/*.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: hmac-hkdf-extraction-untrusted-pr
          path: |
            .abc/hmac-hkdf-extraction/run-*/result.json
            .abc/hmac-hkdf-extraction/run-*/*.log
            .abc/hmac-hkdf-extraction/run-*/*.llbc
            .abc/hmac-hkdf-extraction/run-*/hmac-*/**/*.lean
            .abc/hmac-hkdf-extraction/run-*/hkdf-*/**/*.lean
          if-no-files-found: warn
          retention-days: 7
