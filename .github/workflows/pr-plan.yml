name: ABC pull request assurance

on: pull_request

permissions:
  contents: read

concurrency:
  group: abc-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: baseline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - id: plan
        working-directory: baseline
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m tools.abc_ci plan --repo ../candidate --base "$EVENT_BASE" --head "$EVENT_HEAD"

  modules:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/module-check.yml
    with:
      base: ${{ github.event.pull_request.base.sha }}
      head: ${{ github.event.pull_request.head.sha }}
      target: ${{ matrix.target }}
      artifact: ${{ matrix.artifact }}

  abc-required:
    name: abc-required
    if: ${{ always() }}
    needs: [plan, modules]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require actual planning and execution
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MODULES_RESULT: ${{ needs.modules.result }}
        run: test "$PLAN_RESULT" = success && test "$MODULES_RESULT" = success
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: baseline
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: abc-task-*
          path: receipts
      - name: Check the expected task closure and attached outputs
        working-directory: baseline
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -m tools.abc_ci gate --repo ../candidate --base "$EVENT_BASE" --head "$EVENT_HEAD" --directory ../receipts
