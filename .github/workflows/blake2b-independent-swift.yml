name: ABC independent Swift BLAKE2b

on:
  pull_request:
    paths:
      - 'src/crypto/hash/blake2b/impl/cpp/check.py'
      - 'src/crypto/hash/blake2b/impl/swift/**'
      - '.github/workflows/blake2b-independent-swift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-swift:
    name: Swift 6.1.2 macOS BLAKE2b
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.14'
      - name: Generate reference vectors and exercise native Swift
        shell: bash
        run: |
          set -euo pipefail
          leaf=src/crypto/hash/blake2b/impl/swift
          package="$leaf/AbcBlake2bSwift"
          evidence=dist/swift-blake2b
          mkdir -p "$evidence"
          export ABC_BLAKE2B_FIXTURES="$RUNNER_TEMP/abc-blake2b-fixtures.txt"
          python -B "$leaf/make_fixtures.py" "$ABC_BLAKE2B_FIXTURES"
          swift --version | tee "$evidence/toolchain.txt"
          grep -E 'Apple Swift version 6\.1\.2([[:space:]]|$)' "$evidence/toolchain.txt"
          grep -E '^Target: arm64-apple-macosx' "$evidence/toolchain.txt"
          swift test --package-path "$package" --scratch-path "$RUNNER_TEMP/AbcBlake2bSwift" \
            --configuration release -Xswiftc -warnings-as-errors 2>&1 | tee "$evidence/swift-test.log"
          grep -E 'Executed 1 test, with 0 failures' "$evidence/swift-test.log"
          grep -Fx 'known_answers=5' "$evidence/swift-test.log"
          grep -Fx 'openssl_comparisons=139' "$evidence/swift-test.log"
          grep -Fx 'hashlib_comparisons=697' "$evidence/swift-test.log"
          grep -Fx 'snapshots=841' "$evidence/swift-test.log"
          grep -Fx 'streaming_splits=4926' "$evidence/swift-test.log"
          shasum -a 256 "$package/Sources/AbcBlake2bSwift/Blake2b.swift" \
            "$package/Tests/AbcBlake2bSwiftTests/Blake2bTests.swift" "$ABC_BLAKE2B_FIXTURES" \
            > "$evidence/source-sha256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abc-swift-blake2b-macos-arm64
          path: dist/swift-blake2b/
          if-no-files-found: error
          retention-days: 7
