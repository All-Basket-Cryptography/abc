schema_version = 1
id = "aes256-gcm-java-sunjce"
owned_paths = ["src/crypto/aead/aes256-gcm/impl/java"]
shared_inputs = ["src/crypto/cipher/aes256/impl/java/check.py"]
dependencies = [{ module = "aes256-gcm-rust", type = "implements" }]
lean_sources = { Aes256GcmJvmBounds = "src/crypto/aead/aes256-gcm/impl/java" }

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/cipher/aes256/impl/java/check.py", "--algorithm", "aes256-gcm", "--language", "java"]
tools = ["python", "java", "javac", "jar", "node"]
target = "jvm-jdk17"
timeout_seconds = 240

[tasks.adapter-bounds]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/aead/aes256-gcm/impl/java/Aes256GcmJvmBounds.lean"]
tools = ["lean"]
timeout_seconds = 60
