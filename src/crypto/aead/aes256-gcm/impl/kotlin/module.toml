schema_version = 1
id = "aes256-gcm-kotlin-sunjce"
owned_paths = ["src/crypto/aead/aes256-gcm/impl/kotlin"]
shared_inputs = ["src/crypto/cipher/aes256/impl/java/check.py", "src/crypto/aead/aes256-gcm/impl/java/tests/Checks.java", "src/crypto/aead/aes256-gcm/impl/java/Aes256GcmJvmBounds.lean"]
dependencies = [{ module = "aes256-gcm-rust", type = "implements" }]

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/cipher/aes256/impl/java/check.py", "--algorithm", "aes256-gcm", "--language", "kotlin"]
tools = ["python", "java", "javac", "node"]
target = "kotlin-jvm-jdk17"
timeout_seconds = 240

[tasks.adapter-bounds]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/aead/aes256-gcm/impl/java/Aes256GcmJvmBounds.lean"]
tools = ["lean"]
timeout_seconds = 60
