schema_version = 1
id = "aes256-gcm-rust"
owned_paths = ["src/crypto/aead/aes256-gcm"]
cargo_manifests = ["src/crypto/aead/aes256-gcm/impl/rust/Cargo.toml"]
lean_sources = { Aes256GcmBounds = "src/crypto/aead/aes256-gcm/spec" }

[tasks.test]
kind = "test"
command = ["cargo", "+1.92.0", "test", "--manifest-path", "tools/build/rust/Cargo.toml", "--locked", "--offline", "-p", "abc-aes256-gcm"]
tools = ["cargo", "rustc", "rustup"]
timeout_seconds = 120

[tasks.proof]
kind = "formal"
command = ["lean", "src/crypto/aead/aes256-gcm/spec/Aes256GcmBounds.lean"]
tools = ["lean"]
timeout_seconds = 120
