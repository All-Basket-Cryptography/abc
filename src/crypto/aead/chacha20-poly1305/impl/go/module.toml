schema_version = 1
id = "chacha20-poly1305-go-portable"
owned_paths = ["src/crypto/aead/chacha20-poly1305/impl/go"]
dependencies = [{ module = "chacha20-go-portable", type = "calls" }, { module = "poly1305-go-portable", type = "calls" }]

[tasks.test]
kind = "test"
command = ["go", "test", "-C", "src/crypto/aead/chacha20-poly1305/impl/go", "-count=1", "./..."]
tools = ["go"]
target = "portable"
timeout_seconds = 120

[tasks.openssl]
kind = "test"
command = ["go", "test", "-C", "src/crypto/aead/chacha20-poly1305/impl/go", "-count=1", "-run", "^TestOpenSSL$", "./..."]
tools = ["go", "node"]
target = "node-openssl"
timeout_seconds = 120
