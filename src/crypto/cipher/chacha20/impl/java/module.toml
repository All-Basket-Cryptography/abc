schema_version = 1
id = "chacha20-java-portable"
owned_paths = ["src/crypto/cipher/chacha20/impl/java"]
dependencies = [{ module = "chacha20-spec", type = "implements" }]
lean_sources = { ChaCha20StreamingBounds = "src/crypto/cipher/chacha20/impl/java" }

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/cipher/chacha20/impl/java/check.py"]
tools = ["python", "java", "javac", "jar"]
target = "jvm-jdk17"
timeout_seconds = 180

[tasks.streaming-bounds]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/cipher/chacha20/impl/java/ChaCha20StreamingBounds.lean"]
tools = ["lean"]
timeout_seconds = 60
