schema_version = 1
id = "aes256-rust"
owned_paths = ["src/crypto/cipher/aes256"]
cargo_manifests = ["src/crypto/cipher/aes256/impl/rust/Cargo.toml"]
lean_sources = { Aes256Byte = "src/crypto/cipher/aes256/spec" }

[tasks.test]
kind = "test"
command = ["cargo", "+1.92.0", "test", "--manifest-path", "tools/build/rust/Cargo.toml", "--locked", "--offline", "-p", "abc-aes256"]
tools = ["cargo", "rustc", "rustup"]
timeout_seconds = 120

[tasks.proof]
kind = "formal"
command = ["lean", "src/crypto/cipher/aes256/spec/Aes256Byte.lean"]
tools = ["lean"]
timeout_seconds = 120
