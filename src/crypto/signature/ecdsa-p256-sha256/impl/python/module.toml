schema_version = 1
id = "ecdsa-p256-sha256-python-provider"
owned_paths = ["src/crypto/signature/ecdsa-p256-sha256/impl/python"]
dependencies = [
  { module = "crypto-providers-python", type = "imports" },
  { module = "ecdsa-p256-sha256-c-openssl", type = "imports" },
]
shared_inputs = ["src/crypto/signature/ecdsa-p256-sha256/impl/c/check.py", "src/crypto/kdf/argon2id/impl/c/openssl_support.py"]

[tasks.test]
kind = "test"
command = ["python", "-B", "src/crypto/signature/ecdsa-p256-sha256/impl/python/check_native.py"]
tools = ["python", "clang", "llvm-dlltool", "node"]
target = "windows-x64-openssl"
timeout_seconds = 240
