schema_version = 1
id = "ml-dsa-65-csharp-bc"
owned_paths = ["src/crypto/signature/ml-dsa-65/impl/csharp"]
shared_inputs = [
  "src/crypto/providers/csharp/check.py",
  "src/crypto/providers/csharp/provider.toml",
  "src/crypto/providers/csharp/global.json",
  "src/crypto/signature/ml-dsa-65/impl/java/check.py",
  "src/crypto/kdf/argon2id/impl/java/bc_provider.py",
  "src/crypto/kdf/argon2id/impl/java/bcprov.toml",
  "src/crypto/signature/ml-dsa-65/spec/acvp-fips204-sample.json",
]
dependencies = [
  { module = "csharp-bouncycastle-provider", type = "calls" },
  { module = "ml-dsa-65-go", type = "implements" },
]

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/providers/csharp/check.py", "--profile", "ml-dsa-65"]
tools = ["python", "dotnet", "node"]
target = "net10.0"
timeout_seconds = 240
