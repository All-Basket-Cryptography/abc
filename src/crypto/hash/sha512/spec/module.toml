schema_version = 1
id = "sha512-spec"
owned_paths = ["src/crypto/hash/sha512/spec"]
lean_sources = { Sha512Length = "src/crypto/hash/sha512/spec", Sha512Ring = "src/crypto/hash/sha512/spec" }

[tasks.check]
