schema_version = 1
id = "sha3-256-swift"
owned_paths = ["src/crypto/hash/sha3-256/impl/swift"]
dependencies = [{ module = "sha3-encoding-spec", type = "implements" }, { module = "keccak-p1600-swift", type = "imports" }]

[tasks.test]
kind = "test"
command = ["swift", "test", "--package-path", "src/crypto/hash/sha3-256/impl/swift/AbcSha3256Swift", "--configuration", "release", "-Xswiftc", "-warnings-as-errors"]
tools = ["swift"]
target = "macos"
timeout_seconds = 180
