schema_version = 1
id = "shake256-rust"
owned_paths = ["src/crypto/hash/shake256/impl/rust"]
cargo_manifests = ["src/crypto/hash/shake256/impl/rust/Cargo.toml"]
dependencies = [{ module = "shake256-spec", type = "implements" }]

[tasks.test]
kind = "test"
command = ["cargo", "+1.92.0", "test", "--manifest-path", "tools/build/rust/Cargo.toml", "--locked", "--offline", "-p", "abc-shake256"]
tools = ["cargo", "rustc", "rustup"]
timeout_seconds = 120
