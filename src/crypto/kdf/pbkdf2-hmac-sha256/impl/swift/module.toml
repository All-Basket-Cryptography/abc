schema_version = 1
id = "pbkdf2-hmac-sha256-swift"
owned_paths = ["src/crypto/kdf/pbkdf2-hmac-sha256/impl/swift"]
dependencies = [
  { module = "hmac-sha256-swift", type = "calls" },
  { module = "pbkdf2-hmac-sha256-spec", type = "implements" },
]

[tasks.macos-tests]
kind = "test"
command = ["swift", "test", "--package-path", "src/crypto/kdf/pbkdf2-hmac-sha256/impl/swift/AbcPbkdf2Sha256Swift", "--scratch-path", ".abc/swift-pbkdf2-tests", "--configuration", "release", "-Xswiftc", "-warnings-as-errors"]
tools = ["swift"]
target = "macos-swift6.1.2"
timeout_seconds = 240
