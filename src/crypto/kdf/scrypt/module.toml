schema_version = 1
id = "scrypt-rust"
owned_paths = ["src/crypto/kdf/scrypt"]
cargo_manifests = ["src/crypto/kdf/scrypt/impl/rust/Cargo.toml"]
lean_sources = { ScryptBounds = "src/crypto/kdf/scrypt/spec", ScryptFunctional = "src/crypto/kdf/scrypt/spec", ScryptAlternating = "src/crypto/kdf/scrypt/spec", ScryptSalsaSource = "src/crypto/kdf/scrypt/spec", ScryptBlockMixSource = "src/crypto/kdf/scrypt/spec" }
lean_external_imports = { SalsaLlbc = "tools/verification/scrypt/salsa_llbc.py" }

[tasks.test]
kind = "test"
command = ["cargo", "+1.92.0", "test", "--manifest-path", "tools/build/rust/Cargo.toml", "--locked", "--offline", "-p", "abc-scrypt"]
tools = ["cargo", "rustc", "rustup"]
timeout_seconds = 120

[tasks.differential]
kind = "test"
command = ["python", "-B", "src/crypto/kdf/scrypt/spec/verify.py"]
tools = ["python", "cargo", "rustc", "rustup"]
timeout_seconds = 120

[tasks.proof]
kind = "formal"
command = ["lean", "src/crypto/kdf/scrypt/spec/ScryptBounds.lean"]
tools = ["lean"]
timeout_seconds = 120

[tasks.functional-model]
kind = "formal"
command = ["python", "-B", "src/lean/check.py", "scrypt"]
tools = ["python", "lean"]
timeout_seconds = 120
