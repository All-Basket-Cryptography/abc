schema_version = 1
id = "scrypt-kotlin-portable"
owned_paths = ["src/crypto/kdf/scrypt/impl/kotlin"]
shared_inputs = ["src/crypto/kdf/scrypt/impl/java/check.py", "src/crypto/kdf/scrypt/impl/java/tests/Checks.java", "src/crypto/kdf/scrypt/impl/java/ScryptJvmBounds.lean"]
dependencies = [{ module = "pbkdf2-hmac-sha256-kotlin", type = "calls" }, { module = "scrypt-rust", type = "implements" }]

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/kdf/scrypt/impl/java/check.py", "--language", "kotlin"]
tools = ["python", "java", "javac"]
target = "kotlin-jvm-jdk17"
timeout_seconds = 240

[tasks.workspace-model]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/kdf/scrypt/impl/java/ScryptJvmBounds.lean"]
tools = ["lean"]
timeout_seconds = 60
