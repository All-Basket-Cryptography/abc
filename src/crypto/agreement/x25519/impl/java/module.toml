schema_version = 1
id = "x25519-java-sunec"
owned_paths = ["src/crypto/agreement/x25519/impl/java"]
dependencies = [{ module = "x25519-rust", type = "implements" }]
lean_sources = { X25519JvmEncoding = "src/crypto/agreement/x25519/impl/java" }

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/agreement/x25519/impl/java/check.py", "--language", "java"]
tools = ["python", "java", "javac", "jar", "node"]
target = "jvm-jdk17"
timeout_seconds = 240

[tasks.encoding-model]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/agreement/x25519/impl/java/X25519JvmEncoding.lean"]
tools = ["lean"]
timeout_seconds = 60
