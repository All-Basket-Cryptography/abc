schema_version = 1
id = "hmac-sha256-java-portable"
owned_paths = ["src/crypto/mac/hmac-sha256/impl/java"]
dependencies = [
  { module = "sha256-java", type = "calls" },
  { module = "hmac-sha256-spec", type = "implements" },
]

[tasks.test]
