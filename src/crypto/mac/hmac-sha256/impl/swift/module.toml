schema_version = 1
id = "hmac-sha256-swift"
owned_paths = ["src/crypto/mac/hmac-sha256/impl/swift"]
dependencies = [
  { module = "sha256-swift", type = "calls" },
  { module = "hmac-sha256-spec", type = "implements" },
]

[tasks.macos-tests]
kind = "test"
command = ["python", "-B", "src/crypto/mac/hmac-sha256/impl/swift/check.py"]
tools = ["python", "swift"]
target = "macos-swift6.1.2"
timeout_seconds = 240
