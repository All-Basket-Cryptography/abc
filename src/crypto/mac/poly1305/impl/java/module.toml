schema_version = 1
id = "poly1305-java-portable"
owned_paths = ["src/crypto/mac/poly1305/impl/java"]
dependencies = [{ module = "poly1305-rust", type = "implements" }]
lean_sources = { Poly1305JavaWords = "src/crypto/mac/poly1305/impl/java" }

[tasks.conformance]
kind = "test"
command = ["python", "-B", "src/crypto/mac/poly1305/impl/java/check.py"]
tools = ["python", "java", "javac", "jar"]
target = "jvm-jdk17"
timeout_seconds = 180

[tasks.word-arithmetic]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/mac/poly1305/impl/java/Poly1305JavaWords.lean"]
tools = ["lean"]
timeout_seconds = 60
