timeout_seconds = 60

[tasks.x25519-input-encoding]
kind = "formal"
command = ["lean", "-DwarningAsError=true", "src/crypto/providers/formal/X25519InputEncoding.lean"]
tools = ["lean"]
timeout_seconds = 60
